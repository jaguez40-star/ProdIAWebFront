database_info:
  name: "ECP_PROD"
  type: "SQLite"
  description: "Datos anuales y mensuales de producción de hidrocarburos por gerencia y campo"
  granularity: "annual_and_monthly"
  entity_level: "gerencia y campo"
  coverage: "Historical data (2023-2025)"

tables:
  PROD_2023:
    description: "Producción de hidrocarburos para el año 2023 con valores mensuales y acumulados"
    notes: "⚠️ NO existe columna AÑO - todos los datos son de 2023. Usar literal '2023' en queries."

    columns:
      - name: id_row
        type: INT
        nullable: false
        description: "Identificador único de fila"

      - name: PRODUCTO
        type: VARCHAR(20)
        nullable: false
        description: "Tipo de producto (CRUDO, GAS, BLANCOS)"
        domain: ["CRUDO", "GAS", "BLANCOS"]
        notes: "⚠️ SIEMPRE usar TRIM(PRODUCTO) en WHERE para evitar espacios"

      - name: VICE
        type: VARCHAR(10)
        nullable: false
        description: "Siglas de la gerencia operativa"
        examples: ["GAN", "GCT", "GRM", "GGS", "GOR", "GAA", "GNS"]
        indexed: true

      - name: GERENCIA
        type: VARCHAR(50)
        nullable: true
        description: "Nombre completo de la gerencia"

      - name: CAMPO
        type: VARCHAR(100)
        nullable: false
        description: "Nombre del campo productor (ubicación geográfica)"
        indexed: true
        examples: ["APIAY", "RUBIALES", "CASTILLA", "CHICHIMENE"]
        notes: "⚠️ CAMPO es ubicación geográfica, NO tipo de producto"

      - name: ENERO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en enero 2023"

      - name: FEBRERO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en febrero 2023"

      - name: MARZO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en marzo 2023"

      - name: ABRIL
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en abril 2023"

      - name: MAYO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en mayo 2023"

      - name: JUNIO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en junio 2023"

      - name: JULIO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en julio 2023"

      - name: AGOSTO
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en agosto 2023"

      - name: SEPTIEMBRE
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en septiembre 2023"

      - name: OCTUBRE
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en octubre 2023"

      - name: NOVIEMBRE
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en noviembre 2023"

      - name: DICIEMBRE
        type: DECIMAL(18,2)
        nullable: true
        description: "Producción en diciembre 2023"

      - name: P50_Acum
