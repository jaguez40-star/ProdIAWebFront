    columns:
      - name: idex
        type: VARCHAR
        description: "Identificador interno de la vista (-1, 0, 1)"

      - name: AÑO
        type: VARCHAR
        description: "Año de producción ('2023', '2024', 'Agosto-2025')"
        notes: "⚠️ Almacenado como TEXT, no INT. Valor 2025 dice 'Agosto-2025'"

      - name: BOPD
