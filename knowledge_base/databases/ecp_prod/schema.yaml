sql_syntax:
  dialect: "SQLite"
  limit_clause: "LIMIT N (NOT TOP)"
  functions:
    string_trim: "TRIM(column)"
    type_cast: "CAST(column AS INTEGER)"
    current_year: "strftime('%Y', 'now')"
  parameter_style: ":param_name"
  notes:
    - "SQLite no soporta TOP, usar LIMIT"
    - "Usar strftime para funciones de fecha"
    - "CAST para conversión de tipos"
    - "COALESCE para manejar NULLs"

critical_rules:
  - "⚠️⚠️⚠️ TABLAS REALES: PROD_2023, PROD_2024, PROD_2025, DATA_HOM"
  - "⚠️⚠️⚠️ NO EXISTE tabla TT_GERENCIA_AÑO_PROD - usar UNION ALL entre PROD_*"
  - "⚠️⚠️⚠️ PRODUCTO values: 'CRUDO', 'GAS', 'BLANCOS' (ALWAYS use TRIM)"
  - "⚠️⚠️⚠️ CAMPO es ubicación geográfica (APIAY, RUBIALES), NO tipo de producto"
  - "⚠️⚠️⚠️ NUNCA usar WHERE CAMPO='CRUDO' (error común)"
  - "⚠️ Para producción de crudo: WHERE TRIM(PRODUCTO) = 'CRUDO'"
  - "⚠️ Real_Acum = producción acumulada real del año"
  - "⚠️ PROD_* tables: NO tienen columna AÑO - usar literal '2023', '2024', '2025'"
  - "⚠️⚠️⚠️ Columnas mensuales son PALABRAS COMPLETAS en mayúsculas: ENERO, FEBRERO, MARZO, ABRIL, MAYO, JUNIO, JULIO, AGOSTO, SEPTIEMBRE, OCTUBRE, NOVIEMBRE, DICIEMBRE"
  - "⚠️⚠️⚠️ NUNCA abreviar nombres de meses: usar ENERO (NO 'ENE'), FEBRERO (NO 'FEB'), MARZO (NO 'MAR'), SEPTIEMBRE (NO 'SEP'), etc."
  - "⚠️ VICE column contiene siglas de gerencia (GAN, GCT, GRM, etc.)"
  - "⚠️ Para VICE_HOM (nombres homologados): JOIN con tabla DATA_HOM"
  - "✅ Para consultas anuales históricas: UNION ALL entre PROD_2023, PROD_2024, PROD_2025"
  - "✅ Para consultas mensuales 2025: usar PROD_2025 directamente"

query_patterns:
  national_production_by_year:
    description: "Producción nacional total por año (usando UNION ALL)"
    tables: ["PROD_2023", "PROD_2024", "PROD_2025"]
    pattern: |
      SELECT '2023' AS AÑO, SUM(Real_Acum) as TOTAL
      FROM PROD_2023 WHERE TRIM(PRODUCTO) = 'CRUDO'
      UNION ALL
      SELECT '2024', SUM(Real_Acum)
      FROM PROD_2024 WHERE TRIM(PRODUCTO) = 'CRUDO'
      UNION ALL
      SELECT '2025', SUM(Real_Acum)
      FROM PROD_2025 WHERE TRIM(PRODUCTO) = 'CRUDO'

  production_by_gerencia:
    description: "Producción por gerencia en un año específico"
    tables: ["PROD_2025"]
    pattern: |
      SELECT VICE, SUM(Real_Acum)
      FROM PROD_2025
      WHERE TRIM(PRODUCTO) = 'CRUDO'
      GROUP BY VICE

  monthly_distribution_2025:
    description: "Distribución mensual de producción en 2025"
    table: "PROD_2025"
    pattern: |
      SELECT '2025' AS Anio, TRIM(PRODUCTO) AS Producto,
             SUM(ENERO), SUM(FEBRERO), SUM(MARZO), ...
      FROM PROD_2025
      WHERE TRIM(PRODUCTO) IN ('CRUDO','GAS','BLANCOS')
      GROUP BY TRIM(PRODUCTO)

  yoy_growth:
    description: "Crecimiento año a año (YoY) usando UNION ALL + JOIN"
    tables: ["PROD_2023", "PROD_2024", "PROD_2025"]
    requires_cte: true
    pattern: |
      WITH ProductionByYear AS (
        SELECT '2023' AS AÑO, SUM(Real_Acum) as TOTAL
        FROM PROD_2023 WHERE TRIM(PRODUCTO) = 'CRUDO'
        UNION ALL ...
      )
      SELECT p1.AÑO, p1.TOTAL, p2.TOTAL as ANTERIOR,
             (p1.TOTAL - p2.TOTAL) * 100.0 / p2.TOTAL as VAR_PCT
      FROM ProductionByYear p1
      LEFT JOIN ProductionByYear p2
        ON CAST(p1.AÑO AS INTEGER) = CAST(p2.AÑO AS INTEGER) + 1

metrics:
  Real_Acum:
    full_name: "Producción Acumulada Real"
    unit: "bbl (total year)"
    description: "Producción total acumulada real del año"
    usage: "SUM(Real_Acum) para obtener totales anuales por gerencia/campo/producto"

  PRODUCTO:
    values:
      CRUDO: "Crude oil (petróleo)"
      GAS: "Natural gas"
      BLANCOS: "Refined products (productos blancos)"

common_mistakes:
  - mistake: "WHERE CAMPO = 'CRUDO'"
    correct: "WHERE TRIM(PRODUCTO) = 'CRUDO'"
    reason: "CAMPO es ubicación geográfica, no tipo de producto"

  - mistake: "FROM TT_GERENCIA_AÑO_PROD"
    correct: "FROM PROD_2023 UNION ALL FROM PROD_2024 UNION ALL FROM PROD_2025"
    reason: "TT_GERENCIA_AÑO_PROD no existe en la BD real"

  - mistake: "WHERE AÑO = 2023"
    correct: "FROM PROD_2023 (sin WHERE AÑO)"
    reason: "No hay columna AÑO en PROD_* tables"

  - mistake: "WHERE PRODUCTO = 'CRUDO'"
    correct: "WHERE TRIM(PRODUCTO) = 'CRUDO'"
    reason: "PRODUCTO puede tener espacios en blanco"

  - mistake: "SUM(ENE), SUM(FEB), SUM(MAR), SUM(ABR), SUM(SEP), SUM(OCT), SUM(NOV), SUM(DIC)"
    correct: "SUM(ENERO), SUM(FEBRERO), SUM(MARZO), SUM(ABRIL), SUM(SEPTIEMBRE), SUM(OCTUBRE), SUM(NOVIEMBRE), SUM(DICIEMBRE)"
    reason: "Las columnas de meses usan nombres COMPLETOS en español, NUNCA abreviados"

