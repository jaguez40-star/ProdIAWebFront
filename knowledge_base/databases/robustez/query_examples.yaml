  # =====================================================
  # TIME INTELLIGENCE - MoM / YoY / YTD / ROLLING
  # (Sección D del documento rbt_prod.md)
  # =====================================================

  - id: "rob_time_012_mom_produccion"
    question: "En 2025, por mes, cual es la variacion MoM de produccion del campo RUBIALES?"
    variants:
      - "variacion mes a mes produccion"
      - "cambio mensual produccion"
      - "MoM produccion campo"
      - "muestrame la variacion de la produccion para el campo"
      - "variacion de la produccion del campo"
    keywords: ["variacion", "MoM", "mes a mes", "produccion", "campo"]
    intent: "mom_variation"
    complexity: "advanced"
    sql_query: |
      WITH serie AS (
        SELECT "AÑO" AS AÑO, MES,
               SUM("Producción Aceite Dia_Mes") AS prod
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND CAMPO = 'RUBIALES'
        GROUP BY "AÑO", MES
      )
      SELECT
        AÑO, MES, prod,
        prod - LAG(prod) OVER (ORDER BY AÑO, MES) AS delta_mom,
        CASE
          WHEN LAG(prod) OVER (ORDER BY AÑO, MES) IS NULL THEN NULL
          ELSE (prod * 1.0 / LAG(prod) OVER (ORDER BY AÑO, MES) - 1.0)
        END AS pct_mom
      FROM serie
      ORDER BY AÑO, MES;
    explanation: "Variacion mes a mes (MoM) de produccion con delta absoluto y porcentual"
    critical_notes:
      - "LAG() para obtener valor del mes anterior"
      - "CTE (WITH) para calcular produccion mensual primero"
      - "pct_mom: fraccion decimal (multiplicar por 100 para %)"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # --- Variacion MoM de produccion a nivel GERENCIA ---
  - id: "rob_time_012b_mom_produccion_gerencia"
    question: "Muestrame la variacion de la produccion para la gerencia POE en 2025?"
    variants:
      - "variacion de la produccion para la gerencia"
      - "como vario la produccion de la gerencia"
      - "produccion mes a mes gerencia"
      - "variacion mensual produccion gerencia"
      - "evolucion produccion gerencia por mes"
      - "produccion por mes de la gerencia"
    keywords: ["variacion", "produccion", "gerencia", "mes", "mensual", "evolucion"]
    intent: "mom_variation_gerencia"
    complexity: "advanced"
    sql_query: |
      WITH serie AS (
        SELECT "AÑO" AS AÑO, MES,
               SUM("Producción Aceite Dia_Mes") AS total_produccion
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND UPPER(GERENCIA) = 'POE'
        GROUP BY "AÑO", MES
      )
      SELECT
        AÑO, MES, total_produccion,
        total_produccion - LAG(total_produccion) OVER (ORDER BY AÑO, MES) AS delta_mom,
        CASE
          WHEN LAG(total_produccion) OVER (ORDER BY AÑO, MES) IS NULL THEN NULL
          ELSE ROUND((total_produccion * 1.0 / LAG(total_produccion) OVER (ORDER BY AÑO, MES) - 1.0) * 100, 2)
        END AS variacion_pct
      FROM serie
      ORDER BY AÑO, MES;
    explanation: "Variacion mes a mes de produccion total para una gerencia. Adaptar 'POE' a la gerencia que pregunte el usuario. Usa LAG() para calcular delta absoluto y variacion porcentual."
    critical_notes:
      - "Reemplazar 'POE' con la gerencia que pregunte el usuario (usar UPPER())"
      - "LAG() obtiene valor del mes anterior para calcular variacion"
      - "variacion_pct ya esta multiplicado por 100 (es porcentaje directo)"
      - "CTE serie agrupa produccion mensual antes de calcular variacion"
      - "Si el usuario solo pide 'produccion por mes' sin variacion, omitir delta_mom y variacion_pct"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

