# ROBUSTEZ Query Examples
# Ejemplos de consultas SQL para la base de datos ROBUSTEZ
# Tabla: RESULTADOSREGRESION (SQLite)

query_examples:
  - id: "rob_001_pozos_por_vp"
    question: "Cuantos pozos hay por vicepresidencia?"
    variants:
      - "pozos por VP"
      - "conteo de pozos por vicepresidencia"
      - "distribucion de pozos por VP"
    keywords: ["pozos", "vicepresidencia", "conteo", "UWI"]
    intent: "count_wells_by_hierarchy"
    complexity: "simple"
    sql_query: |
      SELECT
        VICEPRESIDENCIA,
        COUNT(DISTINCT UWI) AS total_pozos
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025 AND MES = 1
      GROUP BY VICEPRESIDENCIA
      ORDER BY total_pozos DESC;
    explanation: "Cuenta pozos unicos (UWI) por vicepresidencia para un mes especifico"
    critical_notes:
      - "Usar COUNT(DISTINCT UWI) porque cada pozo aparece una vez por mes"
      - "Filtrar por un mes especifico para evitar contar pozos multiples veces"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  - id: "rob_002_campos_por_gerencia"
    question: "Cuales campos tiene cada gerencia?"
    variants:
      - "campos por gerencia"
      - "listar campos de cada gerencia"
    keywords: ["campos", "gerencia", "lista"]
    intent: "list_fields_by_management"
    complexity: "simple"
    sql_query: |
      SELECT
        GERENCIA,
        GROUP_CONCAT(DISTINCT CAMPO) AS campos,
        COUNT(DISTINCT CAMPO) AS total_campos
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025 AND MES = 1
      GROUP BY GERENCIA
      ORDER BY total_campos DESC;
    explanation: "Lista los campos distintos de cada gerencia"
    critical_notes:
      - "GROUP_CONCAT agrupa los nombres de campos en una lista separada por comas"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  - id: "rob_003_breakeven_por_campo"
    question: "Cual es el breakeven promedio por campo?"
    variants:
      - "breakeven por campo"
      - "costo breakeven promedio"
      - "precio de equilibrio por campo"
    keywords: ["breakeven", "campo", "promedio", "costo"]
    intent: "breakeven_by_field"
    complexity: "medium"
    sql_query: |
      SELECT
        CAMPO,
        ROUND(AVG("Breakeven (Activos) USD/Bl"), 2) AS breakeven_promedio,
        COUNT(DISTINCT UWI) AS total_pozos
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025
        AND "TIPO DE POZO" = 'PRODUCTION'
        AND "Breakeven (Activos) USD/Bl" IS NOT NULL
      GROUP BY CAMPO
      ORDER BY breakeven_promedio ASC
      LIMIT 20;
    explanation: "Calcula el breakeven promedio (USD/barril) por campo para pozos de produccion"
    critical_notes:
      - "Usar AVG para breakeven (es precio unitario, no se suma)"
      - "Filtrar solo pozos de PRODUCTION para breakeven relevante"
      - "Columnas con espacios y parentesis necesitan comillas dobles"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  - id: "rob_004_ebitda_por_vp"
    question: "Cual es el EBITDA total por vicepresidencia?"
    variants:
      - "EBITDA por VP"
      - "EBITDA total por vicepresidencia"
      - "rentabilidad por VP"
    keywords: ["ebitda", "vicepresidencia", "total", "rentabilidad"]
    intent: "ebitda_by_vp"
    complexity: "medium"
    sql_query: |
      SELECT
        VICEPRESIDENCIA,
        ROUND(SUM("EBITDA (Activo) KUSD"), 2) AS ebitda_total_kusd,
        COUNT(DISTINCT CAMPO) AS total_campos,
        COUNT(DISTINCT UWI) AS total_pozos
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025
      GROUP BY VICEPRESIDENCIA
      ORDER BY ebitda_total_kusd DESC;
    explanation: "Suma el EBITDA de todos los pozos activos por vicepresidencia para el ano 2025"
    critical_notes:
      - "Usar SUM para EBITDA (se agregan los valores de cada pozo)"
      - "EBITDA esta en KUSD (miles de dolares)"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  - id: "rob_005_rentabilidad_por_gerencia"
    question: "Cuantos pozos son rentables vs no rentables por gerencia?"
    variants:
      - "pozos rentables por gerencia"
      - "clasificacion de rentabilidad por gerencia"
      - "pozos marginales y no rentables"
    keywords: ["rentable", "no rentable", "marginal", "gerencia", "clasificacion"]
    intent: "profitability_classification"
    complexity: "medium"
    sql_query: |
      SELECT
        GERENCIA,
        "Condición Real (Activos)" AS condicion,
        COUNT(DISTINCT UWI) AS total_pozos
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025 AND MES = 1
        AND "Condición Real (Activos)" IS NOT NULL
      GROUP BY GERENCIA, "Condición Real (Activos)"
      ORDER BY GERENCIA, total_pozos DESC;
    explanation: "Clasifica pozos por condicion de rentabilidad (RENTABLE, MARGINAL, NO RENTABLE) para cada gerencia"
    critical_notes:
      - "Filtrar un mes especifico para evitar contar pozos multiples veces"
      - "La columna Condición (CON TILDE) tiene valores: RENTABLE, MARGINAL, NO RENTABLE"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # =====================================================
  # RENTABILIDAD + TOP POZOS EBITDA (3 niveles jerarquicos)
  # Clasificacion RENTABLE/MARGINAL/NO RENTABLE con Top 2
  # pozos por EBITDA en cada nivel de agrupacion
  # =====================================================

  # --- Nivel VP: todas las gerencias ---
  - id: "rob_006_rentabilidad_top_ebitda_vp"
    question: "Cuantos pozos son rentables vs no rentables por gerencia con los top 2 pozos de mayor EBITDA?"
    variants:
      - "pozos rentables por gerencia con top EBITDA"
      - "clasificacion rentabilidad por gerencia y mejores pozos"
      - "rentabilidad por gerencia con ranking EBITDA"
      - "rentables vs no rentables por gerencia top pozos"
    keywords: ["rentable", "no rentable", "marginal", "gerencia", "EBITDA", "top", "clasificacion", "ranking"]
    intent: "profitability_with_top_wells"
    complexity: "advanced"
    sql_query: |
      WITH clasificacion AS (
        SELECT GERENCIA,
               "Condición Real (Activos)" AS condicion,
               COUNT(DISTINCT UWI) AS total_pozos
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND MES = 1
          AND "Condición Real (Activos)" IS NOT NULL
        GROUP BY GERENCIA, "Condición Real (Activos)"
      ),
      top_pozos AS (
        SELECT GERENCIA, UWI,
               ROUND(SUM("EBITDA (Activo) KUSD"), 2) AS ebitda_kusd,
               ROW_NUMBER() OVER (
                 PARTITION BY GERENCIA
                 ORDER BY SUM("EBITDA (Activo) KUSD") DESC
               ) AS rn
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025
        GROUP BY GERENCIA, UWI
      )
      SELECT c.GERENCIA, c.condicion, c.total_pozos,
             t.UWI AS top_pozo, t.ebitda_kusd, t.rn AS ranking
      FROM clasificacion c
      LEFT JOIN top_pozos t ON c.GERENCIA = t.GERENCIA AND t.rn <= 2
      ORDER BY c.GERENCIA, c.condicion, t.rn;
    explanation: "Combina clasificacion de rentabilidad (RENTABLE/MARGINAL/NO RENTABLE) con top 2 pozos por EBITDA para cada gerencia. CTE clasificacion cuenta pozos filtrando un solo mes (MES=1) para evitar duplicados. CTE top_pozos suma EBITDA del año completo sin filtrar mes."
    critical_notes:
      - "CTE clasificacion usa MES = 1 para conteo correcto (evitar duplicados)"
      - "CTE top_pozos NO filtra MES - usa SUM del año completo para EBITDA total"
      - "ROW_NUMBER() OVER (PARTITION BY GERENCIA) para top 2 POR CADA gerencia"
      - "LEFT JOIN para no perder clasificaciones sin datos de EBITDA"
      - "Condición (CON TILDE) tiene valores: RENTABLE, MARGINAL, NO RENTABLE"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # --- Nivel Gerencia: campos dentro de una gerencia ---
  - id: "rob_007_rentabilidad_top_ebitda_gerencia"
    question: "En la gerencia PPC, cuantos pozos son rentables vs no rentables por campo con los top 2 pozos de mayor EBITDA?"
    variants:
      - "pozos rentables por campo en gerencia con top EBITDA"
      - "clasificacion rentabilidad por campo en una gerencia"
      - "rentables vs no rentables por campo top pozos gerencia"
      - "rentabilidad campos gerencia con mejores pozos"
    keywords: ["rentable", "no rentable", "campo", "gerencia", "EBITDA", "top", "clasificacion"]
    intent: "profitability_with_top_wells_by_field"
    complexity: "advanced"
    sql_query: |
      WITH clasificacion AS (
        SELECT CAMPO,
               "Condición Real (Activos)" AS condicion,
               COUNT(DISTINCT UWI) AS total_pozos
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND MES = 1
          AND UPPER(GERENCIA) = 'PPC'
          AND "Condición Real (Activos)" IS NOT NULL
        GROUP BY CAMPO, "Condición Real (Activos)"
      ),
      top_pozos AS (
        SELECT CAMPO, UWI,
               ROUND(SUM("EBITDA (Activo) KUSD"), 2) AS ebitda_kusd,
               ROW_NUMBER() OVER (
                 PARTITION BY CAMPO
                 ORDER BY SUM("EBITDA (Activo) KUSD") DESC
               ) AS rn
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND UPPER(GERENCIA) = 'PPC'
        GROUP BY CAMPO, UWI
      )
      SELECT c.CAMPO, c.condicion, c.total_pozos,
             t.UWI AS top_pozo, t.ebitda_kusd, t.rn AS ranking
      FROM clasificacion c
      LEFT JOIN top_pozos t ON c.CAMPO = t.CAMPO AND t.rn <= 2
      ORDER BY c.CAMPO, c.condicion, t.rn;
    explanation: "Para una gerencia especifica, combina clasificacion de rentabilidad por campo con top 2 pozos por EBITDA dentro de cada campo. Adaptar 'PPC' al nombre de la gerencia que pregunte el usuario."
    critical_notes:
      - "Reemplazar 'PPC' con la gerencia que pregunte el usuario (usar UPPER())"
      - "CTE clasificacion usa MES = 1 para conteo correcto"
      - "CTE top_pozos SUM del año completo para EBITDA total"
      - "PARTITION BY CAMPO para top 2 POR CADA campo"
      - "Ambas CTEs filtran por la misma gerencia"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # --- Nivel Campo: pozos dentro de un campo ---
  - id: "rob_008_rentabilidad_top_ebitda_campo"
    question: "En el campo CASTILLA, cuantos pozos son rentables vs no rentables con los top 2 pozos de mayor EBITDA?"
    variants:
      - "pozos rentables en campo con top EBITDA"
      - "clasificacion rentabilidad campo con mejores pozos"
      - "rentables vs no rentables en un campo top pozos"
      - "condicion pozos campo con ranking EBITDA"
    keywords: ["rentable", "no rentable", "campo", "EBITDA", "top", "pozo", "clasificacion"]
    intent: "profitability_with_top_wells_in_field"
    complexity: "advanced"
    sql_query: |
      WITH clasificacion AS (
        SELECT "Condición Real (Activos)" AS condicion,
               COUNT(DISTINCT UWI) AS total_pozos
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND MES = 1
          AND UPPER(CAMPO) = 'CASTILLA'
          AND "Condición Real (Activos)" IS NOT NULL
        GROUP BY "Condición Real (Activos)"
      ),
      top_pozos AS (
        SELECT UWI,
               "Condición Real (Activos)" AS condicion,
               ROUND(SUM("EBITDA (Activo) KUSD"), 2) AS ebitda_kusd,
               ROW_NUMBER() OVER (
                 ORDER BY SUM("EBITDA (Activo) KUSD") DESC
               ) AS rn
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND UPPER(CAMPO) = 'CASTILLA'
        GROUP BY UWI, "Condición Real (Activos)"
      )
      SELECT c.condicion, c.total_pozos,
             t.UWI AS top_pozo, t.condicion AS top_pozo_condicion,
             t.ebitda_kusd, t.rn AS ranking
      FROM clasificacion c
      LEFT JOIN top_pozos t ON t.rn <= 2
      ORDER BY c.condicion, t.rn;
    explanation: "Para un campo especifico, muestra clasificacion de rentabilidad y top 2 pozos por EBITDA total del año. Adaptar 'CASTILLA' al nombre del campo que pregunte el usuario."
    critical_notes:
      - "Reemplazar 'CASTILLA' con el campo que pregunte el usuario (usar UPPER())"
      - "A nivel campo, no hay PARTITION BY en ROW_NUMBER (un solo campo)"
      - "LEFT JOIN con rn <= 2: cada fila de clasificacion muestra los mismos top 2 pozos del campo"
      - "top_pozo_condicion indica si el pozo top es RENTABLE, MARGINAL o NO RENTABLE"
      - "CTE clasificacion usa MES = 1 para conteo correcto"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # =====================================================
  # PLANTILLAS SQL ENTERPRISE (Diccionario LLM v2)
  # =====================================================

  # --- Plantilla 2.1: Conteo por Jerarquia ---
  - id: "rob_ent_001_conteo_por_gerencia"
    question: "Cuantos pozos existen por cada gerencia?"
    variants:
      - "total de pozos por gerencia"
      - "conteo de UWI por gerencia"
      - "cuantos pozos tiene cada gerencia"
    keywords: ["pozos", "gerencia", "conteo", "UWI"]
    intent: "count_wells_by_hierarchy"
    complexity: "simple"
    sql_query: |
      SELECT GERENCIA,
             COUNT(DISTINCT UWI) AS TOTAL_POZOS
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025 AND MES = 1
      GROUP BY GERENCIA
      ORDER BY TOTAL_POZOS DESC;
    explanation: "Cuenta pozos unicos por gerencia filtrando un mes especifico para evitar duplicados"
    critical_notes:
      - "Usar COUNT(DISTINCT UWI) porque un pozo aparece una vez por mes"
      - "Filtrar por un mes especifico (MES = 1) para conteo correcto"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # --- Plantilla 2.2: Validacion de duplicados ---
  - id: "rob_ent_002_validar_duplicados"
    question: "Existen registros duplicados en la tabla?"
    variants:
      - "hay combinaciones UWI-MES-ANO repetidas"
      - "validar duplicados"
      - "registros repetidos"
    keywords: ["duplicados", "repetidos", "validacion", "UWI"]
    intent: "data_validation"
    complexity: "medium"
    sql_query: |
      SELECT UWI, MES, "AÑO", COUNT(*) AS CNT
      FROM RESULTADOSREGRESION
      GROUP BY UWI, MES, "AÑO"
      HAVING CNT > 1
      LIMIT 20;
    explanation: "Detecta combinaciones UWI-MES-ANO que aparecen mas de una vez (posibles duplicados)"
    critical_notes:
      - "HAVING CNT > 1 filtra solo los duplicados"
      - "Usar LIMIT para evitar resultados excesivos"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # --- Plantilla 2.3: Distribucion por estado ---
  - id: "rob_ent_003_distribucion_estado"
    question: "Cual es la distribucion de estados de pozo por gerencia?"
    variants:
      - "pozos activos e inactivos por gerencia"
      - "estado de pozos por gerencia"
      - "cuantos pozos activos tiene cada gerencia"
    keywords: ["estado", "pozo", "gerencia", "activo", "inactivo", "distribucion"]
    intent: "distribution_by_status"
    complexity: "medium"
    sql_query: |
      SELECT GERENCIA,
             "ESTADO POZO",
             COUNT(DISTINCT UWI) AS TOTAL
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025 AND MES = 1
      GROUP BY GERENCIA, "ESTADO POZO"
      ORDER BY GERENCIA, TOTAL DESC;
    explanation: "Distribucion de pozos por estado (ACT, INACT, SUS, ABA) para cada gerencia"
    critical_notes:
      - "ESTADO POZO requiere comillas dobles (tiene espacio)"
      - "Filtrar un mes especifico para evitar contar pozos multiples veces"
      - "Valores posibles: ACT, INACT, SUS, ABA"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  # --- Plantilla 2.4: Promedio ponderado (CLAVE ENTERPRISE) ---
  - id: "rob_ent_004_promedio_ponderado"
    question: "Cual es la tasa de produccion ponderada por campo?"
    variants:
      - "produccion ponderada por dias"
      - "tasa promedio ponderada por campo"
      - "produccion aceite ponderada"
    keywords: ["ponderado", "tasa", "produccion", "campo", "promedio"]
    intent: "weighted_average"
    complexity: "advanced"
    sql_query: |
      SELECT CAMPO,
             ROUND(SUM("Tasa Producción Aceite" * PROD_DAYS) / SUM(PROD_DAYS), 2) AS TASA_PONDERADA
      FROM RESULTADOSREGRESION
      WHERE "AÑO" = 2025
        AND PROD_DAYS > 0
      GROUP BY CAMPO
      ORDER BY TASA_PONDERADA DESC
      LIMIT 20;
    explanation: "Calcula promedio ponderado de tasa de produccion por dias efectivos de produccion"
    critical_notes:
      - "REGLA ENTERPRISE: Para promedios de tasas usar SUM(tasa * PROD_DAYS) / SUM(PROD_DAYS)"
      - "NUNCA usar AVG() simple para tasas - distorsiona el resultado"
      - "Filtrar PROD_DAYS > 0 para evitar division por cero"
      - "AVG() solo es correcto para breakeven (precio unitario)"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

