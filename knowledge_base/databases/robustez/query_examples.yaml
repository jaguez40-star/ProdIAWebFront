  - id: "rob_time_014_ytd_acumulado"
    question: "En 2025, por mes, muestrame el acumulado YTD de produccion del campo CASTILLA"
    variants:
      - "acumulado year to date"
      - "produccion acumulada por mes"
      - "running sum produccion"
    keywords: ["YTD", "acumulado", "produccion", "mes", "campo"]
    intent: "ytd_cumulative"
    complexity: "advanced"
    sql_query: |
      WITH serie AS (
        SELECT "AÑO" AS AÑO, MES, SUM("Producción Aceite Dia_Mes") AS prod
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND CAMPO = 'CASTILLA'
        GROUP BY "AÑO", MES
      )
      SELECT
        AÑO, MES, prod,
        SUM(prod) OVER (ORDER BY AÑO, MES) AS prod_ytd
      FROM serie
      ORDER BY AÑO, MES;
    explanation: "Acumulado year-to-date (YTD) de produccion por mes usando ventana SUM()"
    critical_notes:
      - "SUM() OVER (ORDER BY) para running sum acumulado"
      - "CTE para calcular produccion mensual base"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  - id: "rob_time_015_rolling_3m"
    question: "En 2025, por mes, calcula el promedio movil 3M de produccion del campo RUBIALES"
    variants:
      - "promedio movil 3 meses"
      - "rolling average produccion"
      - "media movil trimestral"
    keywords: ["promedio movil", "rolling", "3M", "produccion", "campo"]
    intent: "rolling_average"
    complexity: "advanced"
    sql_query: |
      WITH serie AS (
        SELECT "AÑO" AS AÑO, MES, SUM("Producción Aceite Dia_Mes") AS prod
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND CAMPO = 'RUBIALES'
        GROUP BY "AÑO", MES
      )
      SELECT
        AÑO, MES, prod,
        AVG(prod) OVER (ORDER BY AÑO, MES ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS rolling_3m_avg
      FROM serie
      ORDER BY AÑO, MES;
    explanation: "Promedio movil de 3 meses usando ventana ROWS BETWEEN 2 PRECEDING"
    critical_notes:
      - "ROWS BETWEEN 2 PRECEDING AND CURRENT ROW = ventana de 3 filas"
      - "Los primeros 2 meses tendran ventana incompleta"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

  - id: "rob_time_016_comparar_campos"
    question: "En 2025, por mes, compara produccion entre los campos RUBIALES y CASTILLA"
