  - id: "rob_time_017_participacion_campo_gerencia"
    question: "En 2025, por mes, que porcentaje de la produccion de la gerencia GAN aporta el campo RUBIALES?"
    variants:
      - "participacion campo en gerencia"
      - "porcentaje produccion campo vs gerencia"
      - "share mensual campo"
    keywords: ["porcentaje", "participacion", "campo", "gerencia", "mes"]
    intent: "monthly_share"
    complexity: "advanced"
    sql_query: |
      WITH g AS (
        SELECT "AÑO" AS AÑO, MES, SUM("Producción Aceite Dia_Mes") AS prod_g
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND GERENCIA = 'GAN'
        GROUP BY "AÑO", MES
      ),
      c AS (
        SELECT "AÑO" AS AÑO, MES, SUM("Producción Aceite Dia_Mes") AS prod_c
        FROM RESULTADOSREGRESION
        WHERE "AÑO" = 2025 AND GERENCIA = 'GAN' AND CAMPO = 'RUBIALES'
        GROUP BY "AÑO", MES
      )
      SELECT
        g.AÑO, g.MES, c.prod_c, g.prod_g,
        CASE WHEN g.prod_g = 0 THEN NULL ELSE (c.prod_c * 1.0 / g.prod_g) END AS pct_participacion
      FROM g
      LEFT JOIN c ON c.AÑO = g.AÑO AND c.MES = g.MES
      ORDER BY g.AÑO, g.MES;
    explanation: "Participacion porcentual mensual de un campo dentro de su gerencia"
    critical_notes:
      - "Dos CTEs: una para total gerencia, otra para campo especifico"
      - "LEFT JOIN para no perder meses donde el campo no tiene datos"
      - "pct_participacion como fraccion (multiplicar por 100 para %)"
    tables_used: ["RESULTADOSREGRESION"]
    database: "robustez"

