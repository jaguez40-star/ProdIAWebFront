<!-- Chart Button Row -->
<div id="chart-buttons-section" class="mb-3" style="display: none;">
    <div class="d-flex flex-wrap gap-2 justify-content-center">
        <div id="chart-buttons-container"></div>
    </div>
    <hr class="my-3">
</div>

<!-- Charts Display Area -->
<div id="charts-display-area">
    <!-- Auto-generated charts will appear here -->
</div>

<!-- Empty State -->
<div id="analytics-empty-state" class="text-center text-muted p-3">
    <i class="fas fa-chart-bar fa-2x mb-2"></i>
    <p>Los análisis y gráficos aparecerán aquí después de hacer una consulta</p>
    <p class="small">Este panel generará botones de visualización y gráficos automáticamente.</p>
</div>

<!-- Loading State -->
<div id="analytics-loading" class="text-center p-4" style="display: none;">
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Generando gráfico...</span>
    </div>
    <p class="mt-2 text-muted">Generando visualización...</p>
</div>
