        </div>
      </div>

  ranking_cards:
    template: |
      <div class="ranking-cards-container">
        <h3>{ranking_title}</h3>
        <div class="cards-grid">
          {ranking_cards}
        </div>
      </div>

# Dynamic variable definitions
variables:
  date_formats:
    default: "%Y-%m-%d"
    display: "%d/%m/%Y"
    
  number_formats:
    decimal_places: 2
    thousands_separator: ","
    
  units:
    oil: "bbl/day"
    gas: "MSCF/day" 
    water: "bbl/day"
    gor: "scf/bbl"
    wor: "ratio"

# Context injection rules
context_rules:
  max_vector_results: 5
  similarity_threshold: 0.7
  context_window_size: 2000
  
  injection_priority:
    1: "database_schema"
    2: "sql_examples"
    3: "vector_context"
    4: "user_query"
    5: "additional_context"
