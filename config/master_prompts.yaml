# Master Prompts Configuration for ECP Insights
# Centralized prompt templates for all agents
#
# ====================================================================
# MIGRATION NOTE (2025-01):
# Database schemas and SQL examples are NO LONGER embedded in this file.
# All schemas, examples, and domain knowledge now come from:
#   - knowledge_base/databases/datagenesis/
#   - knowledge_base/databases/ecp_prod/
#   - knowledge_base/domain/
#
# Access via KnowledgeBaseManager (SINGLE SOURCE OF TRUTH)
